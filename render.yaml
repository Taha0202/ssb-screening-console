# ==============================================================================
# Render.com Blueprint Specification (100% Free Tier)
# Automatically deploys the FastAPI Backend and React Frontend
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend: FastAPI Document Screening Engine
  # ----------------------------------------------------------------------------
  - type: web
    name: sih26188-ssb-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/system/health
    envVars:
      - key: AI_INFERENCE_MODE
        value: "LOCAL / OFFLINE"
      - key: OFFLINE_MODE
        value: "true"
      - key: PIPELINE_VERSION
        value: "2.0.0"
      - key: SECRET_KEY
        generateValue: true

  # ----------------------------------------------------------------------------
  # 2. Frontend: React Vite Workstation UI
  # ----------------------------------------------------------------------------
  - type: web
    name: sih26188-ssb-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
