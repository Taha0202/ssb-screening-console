# ==============================================================================
# Render.com Blueprint Specification (100% Free Tier)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend: FastAPI Document Screening Engine (Docker Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: sih26188-ssb-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/system/health
    envVars:
      - key: AI_INFERENCE_MODE
        value: "LOCAL / OFFLINE"
      - key: OFFLINE_MODE
        value: "true"
      - key: PIPELINE_VERSION
        value: "2.0.0"
      - key: SECRET_KEY
        generateValue: true

  # ----------------------------------------------------------------------------
  # 2. Frontend: React Vite Workstation UI (Static Site)
  # ----------------------------------------------------------------------------
  - type: static
    name: sih26188-ssb-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sih26188-ssb-backend.onrender.com/api/v1
